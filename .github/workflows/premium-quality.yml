name: Premium Portfolio Quality
on:
  push:
    branches: [design/premium-portfolio, main]
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 lighthouse@12.8.2
          npx playwright install chromium --with-deps
      - name: Check markup and preserved content
        run: node tests/portfolio-audit.cjs
      - name: Test all routes at seven viewport widths
        run: node tests/premium-quality.cjs
      - name: Measure first-visit mobile performance
        if: always()
        run: |
          python3 -m http.server 4173 > /tmp/portfolio-server.log 2>&1 &
          npx lighthouse http://127.0.0.1:4173 --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility --output=json --output=html --output-path=./test-results/lighthouse --quiet
          node -e "const r=require('./test-results/lighthouse.report.json'); console.log('Mobile performance:',r.categories.performance.score*100,'Accessibility:',r.categories.accessibility.score*100); if(r.categories.performance.score<0.9)process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-quality-results
          path: test-results
