name: Financial Globe Smoke Test
on:
  push:
    branches: [feature/interactive-financial-globe]
  pull_request:
    paths:
      - index.html
      - globe.js
      - globe.css
      - assets/countries.geojson
      - netlify/functions/markets.js
      - tests/globe-smoke.cjs
      - tests/live-data-smoke.cjs
      - tests/portfolio-audit.cjs
      - ux.css
      - vercel.json
      - netlify.toml
      - .github/workflows/globe-smoke.yml
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only Chromium dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Validate unlisted metadata and HTML structure
        run: node tests/portfolio-audit.cjs
      - name: Run real Chromium smoke tests against local HTML site
        run: node tests/globe-smoke.cjs
      - name: Verify live UN Comtrade and World Bank public responses
        run: node tests/live-data-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: globe-browser-screenshot
          path: globe-smoke.png
          if-no-files-found: ignore
