<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">LA Connect — sustainable transport concept for the 2028 Los Angeles Games</title>
<desc id="desc">Conceptual diagram connecting rail hubs, feeder buses, trip planning and payment, and real-time information. This is a proposed network model, not an official transit map.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28174b"/><stop offset=".56" stop-color="#1b1740"/><stop offset="1" stop-color="#111c3d"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b18cff"/><stop offset="1" stop-color="#4fdaca"/></linearGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter></defs>
<rect width="1200" height="720" rx="30" fill="url(#bg)"/>
<g opacity=".11" stroke="#c8b8fc"><path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200M0 630H1200M100 0V720M200 0V720M300 0V720M400 0V720M500 0V720M600 0V720M700 0V720M800 0V720M900 0V720M1000 0V720M1100 0V720"/></g>
<text x="70" y="83" fill="#c8b0ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="4">AUTODESK MOCK CASE STUDY · LA28</text>
<text x="70" y="168" fill="#fff" font-family="Arial,sans-serif" font-size="84" font-weight="800">LA Connect</text>
