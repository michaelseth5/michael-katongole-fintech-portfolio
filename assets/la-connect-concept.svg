<g fill="#24133f" stroke="#ddcaff" stroke-width="7"><circle cx="142" cy="465" r="18"/><circle cx="410" cy="360" r="18"/><circle cx="715" cy="415" r="18"/><circle cx="1040" cy="390" r="18"/></g>
