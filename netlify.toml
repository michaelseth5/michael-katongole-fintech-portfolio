[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/markets"
  to = "/.netlify/functions/markets"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[redirects]]
  from = "/api/financial"
  to = "/.netlify/functions/markets"
  status = 200
  force = true
